# # =============================================================================
# # SCHEDULED QUEUE DRAIN — the floor under the async job queue.
# # Owner: the async-queues stream.
# # -----------------------------------------------------------------------------
# # WHY THIS WORKFLOW EXISTS AT ALL, AND WHY IT IS NOT A vercel.json CRON.
# #
# # The queue's primary trigger is `after()` attached to the grading request
# # (src/lib/queue/schedule.ts), which delivers the common case — grade, email
# # seconds later — with no scheduler involved. What it does NOT provide is a floor:
# # a retry scheduled 240_000 ms out fires only when somebody happens to make a
# # request that triggers a drain. At 03:00 nobody does, so "retry in four minutes"
# # silently means "retry whenever the next student loads a page".
# #
# # The obvious fix is a third entry in vercel.json. It is not available:
# # FREE_STACK.md commits this project to the Vercel HOBBY plan, whose documented
# # limits are TWO cron jobs per project invoked at most ONCE PER DAY whatever
# # expression is written. Both slots are already spent (ingest-submissions and
# # finalize-exams), and a once-a-day drain would be worse than none because it
# # would LOOK like a scheduler. FREE_STACK.md already names GitHub Actions cron as
# # this project's scheduler for exactly this reason (row: "Grand-quiz sweeper ...
# # GitHub Actions cron (free) or Vercel Cron hobby ... shared secret").
# #
# # -----------------------------------------------------------------------------
# # REPOSITORY SECRETS THIS WORKFLOW REQUIRES. Settings -> Secrets and variables ->
# # Actions -> New repository secret. Both are REQUIRED; the workflow fails loudly
# # and immediately if either is missing rather than reporting a green run that did
# # nothing.
# #
# #   CRON_SECRET   The exact value of the deployed app's CRON_SECRET environment
# #                 variable (Vercel -> Project -> Settings -> Environment
# #                 Variables). This is the ONLY credential /api/cron/drain-jobs
# #                 accepts; no user role satisfies it. If it does not match, every
# #                 run fails with 401 — which is the intended, visible outcome of a
# #                 rotated secret, not a bug to work around.
# #
# #   APP_ORIGIN    Absolute origin of the deployment to drain, no trailing slash,
# #                 e.g. https://your-app.vercel.app . A SECRET rather than a
# #                 variable so the production hostname is not published in run logs
# #                 of a public repository.
# #
# # -----------------------------------------------------------------------------
# # HONEST LIMITS OF GITHUB'S SCHEDULER, since the point of this file is a
# # dependable floor and overstating it would defeat that:
# #
# #   * `schedule` is BEST EFFORT. GitHub explicitly does not guarantee on-time
# #     execution and delays of several minutes are normal at times of high load
# #     (the top of the hour is the worst). A 5-minute expression therefore means
# #     "usually within about 5-10 minutes", which is still a floor and is still
# #     enormously better than "when a student next loads a page";
# #   * scheduled workflows are DISABLED AUTOMATICALLY after 60 days of repository
# #     inactivity, and GitHub emails the repository admins when that happens. On a
# #     project with a live cohort this does not arise; on a dormant one, re-enable
# #     the workflow from the Actions tab;
# #   * `schedule` runs only on the DEFAULT BRANCH's copy of this file, and never on
# #     forks. Editing it on a feature branch changes nothing until it merges.
# #
# # The queue is designed so that all of this degrades rather than breaks: a missed
# # tick delays a retry, it does not lose one. `run_after` and the lease are both
# # written by the DATABASE's clock (src/lib/queue/store.ts), so a job stays exactly
# # as eligible as it was until something drains it.
# # =============================================================================
# name: Drain job queue

# on:
#   schedule:
#     # Every 5 minutes. Chosen against the retry ladder it exists to serve: the
#     # backoffs are 30_000 / 60_000 / 120_000 / 240_000 ms, so a 300_000 ms tick
#     # adds at most one interval of lag to any single retry and the whole 5-attempt
#     # ladder still completes inside about 12 minutes. Tighter buys nothing — the
#     # scheduler's own jitter is of the same order. Looser would make the first
#     # 30_000 ms backoff meaningless.
#     - cron: "*/5 * * * *"
#   # So an operator can drain on demand — after fixing a relay, or to confirm the
#   # secrets are right without waiting for a tick. This is the repair path from
#   # src/lib/queue/schedule.ts's trigger 3.
#   workflow_dispatch:

# # Nothing here reads or writes the repository. Stated explicitly so the token this
# # job carries cannot be used for anything if a step is ever added carelessly.
# permissions:
#   contents: read

# # A tick that starts while the previous one is still running would claim the same
# # queue. That is SAFE — `for update skip locked` means two drains partition the
# # work rather than colliding — but it is pointless, and cancelling the older run
# # would abandon a drain mid-batch and leave its jobs leased for LEASE_MS. So:
# # queue up, never cancel.
# concurrency:
#   group: drain-jobs
#   cancel-in-progress: false

